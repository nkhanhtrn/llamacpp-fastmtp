name: build-fastmtp
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04          # match Kaggle's glibc (22.04)
      options: --user root
    timeout-minutes: 150
    env:
      LLAMA_COMMIT: 4df29be4f4c3673f428170fda944a5b19f743bb8
      PATCH_URL: https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch
      PATCH_SHA256: 981285400b59dc45cf99936b6ff66d4b3aa0f1b532f85fa51418cb407e51d615
    steps:
      - name: deps
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl build-essential cmake ca-certificates > /dev/null

      - name: llama.cpp source @ pinned commit
        run: |
          git clone --quiet https://github.com/ggerganov/llama.cpp /src/llama.cpp
          cd /src/llama.cpp
          git checkout -q $LLAMA_COMMIT
          git rev-parse HEAD

      - name: FastMTP patch (sha256-verified)
        working-directory: /src/llama.cpp
        run: |
          curl -sL -o fastmtp.patch "$PATCH_URL"
          echo "$PATCH_SHA256  fastmtp.patch" | sha256sum -c -
          git apply --check fastmtp.patch
          git apply fastmtp.patch
          echo "patch applied cleanly"

      - name: CUDA toolkit
        run: |
          curl -sL -o /tmp/cuda.run "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_570.86.10_linux.run"
          sh /tmp/cuda.run --silent --toolkit --override --no-opengl-libs --no-drm --no-man-page
          rm -f /tmp/cuda.run
          /usr/local/cuda/bin/nvcc --version | tail -2

      - name: build llama-server (CUDA sm_75 = T4)
        working-directory: /src/llama.cpp
        run: |
          export PATH=/usr/local/cuda/bin:$PATH
          cmake -B build -S . \
            -DGGML_CUDA=ON \
            -DGGML_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_LIBRARY_PATH=/usr/local/cuda/lib64/stubs
          cmake --build build --target llama-server -j"$(nproc)"

      - name: bundle (binary + CUDA runtime libs)
        run: |
          mkdir -p /out/bundle/bin /out/bundle/lib
          cp -L /src/llama.cpp/build/bin/llama-server /out/bundle/bin/
          for lib in libcudart.so libcublas.so libcublasLt.so libnvJitLink.so libnvrtc.so; do
            cp -La /usr/local/cuda/lib64/${lib}* /out/bundle/lib/ 2>/dev/null || true
          done
          (cd /out/bundle/lib && for f in *; do [ -L "$f" ] || continue; t=$(readlink -f "$f"); rm -f "$f"; ln -s "$(basename $t)" "$f"; done)
          tar -czf /out/llama-fastmtp-sm75.tar.gz -C /out/bundle .
          sha256sum /out/llama-fastmtp-sm75.tar.gz
          du -sh /out/bundle/lib /out/bundle/bin

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="fastmtp-$(echo $LLAMA_COMMIT | cut -c1-8)-$(date +%Y%m%d)"
          python3 - "$GH_TOKEN" "$REPO" "$TAG" <<'PYEOF'
          import json, sys, urllib.request
          token, repo, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          notes = "\n".join([
              "llama-server with the HauhauCS FastMTP patch (Qwen3.8-27B MTP draft support).",
              "",
              "- Base: ggerganov/llama.cpp @ 4df29be4f4c3673f428170fda944a5b19f743bb8",
              "- Patch: HauhauCS-FastMTP-llama.cpp.patch (sha256 verified in CI)",
              "- CUDA 12.8, arch 75 (Turing T4), bundled runtime libs in lib/",
              "- Built on ubuntu:22.04 (glibc 2.35) for Kaggle compatibility",
              "",
              "Usage: extract, then run",
              "  LD_LIBRARY_PATH=./lib ./bin/llama-server \\",
              "    -m target.gguf --mmproj mmproj.gguf \\",
              "    --spec-draft-model FastMTP-32K.gguf \\",
              "    --spec-draft-ngl all --spec-type draft-mtp --spec-draft-n-max 3 \\",
              "    --spec-draft-p-min 0 -ngl all --jinja",
          ])
          def api(url, data=None, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read())
          h = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          rel = api(f"https://api.github.com/repos/{repo}/releases",
                    json.dumps({"tag_name": tag, "name": tag, "body": notes}).encode(),
                    {**h, "Content-Type": "application/json"})
          print("release:", rel["html_url"])
          asset = api(
              f"https://uploads.github.com/repos/{repo}/releases/{rel['id']}/assets?name=llama-fastmtp-sm75.tar.gz",
              open("/out/llama-fastmtp-sm75.tar.gz", "rb").read(),
              {**h, "Content-Type": "application/gzip"})
          print("asset:", asset["browser_download_url"])
          PYEOF
